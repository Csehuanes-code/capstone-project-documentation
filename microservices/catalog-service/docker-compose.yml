services:
  catalog-db:
    image: postgres:16-alpine
    container_name: catalog-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-catalogo_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - catalog_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-catalogo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  catalog-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catalog-service
    restart: unless-stopped
    depends_on:
      catalog-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@catalog-db:5432/${POSTGRES_DB:-catalogo_db}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      RESERVAS_SERVICE_URL: ${RESERVAS_SERVICE_URL:-http://reservas-service:8003}
      # JWT de Auth (ADR-06): clave pública de Auth o su endpoint /jwks. Ver .env.example.
      JWT_PUBLIC_KEY_FILE: ${JWT_PUBLIC_KEY_FILE:-}
      JWT_JWKS_URL: ${JWT_JWKS_URL:-}
      JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8001}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-santa-marta-platform}
      # RabbitMQ compartido del grupo; vacío = los eventos esperan en la tabla outbox.
      RABBITMQ_URL: ${RABBITMQ_URL:-}
    ports:
      - "${PORT:-8002}:8000"   # 8002 en el PC (puertos del grupo: IA 8000, Auth 8001, Catálogo 8002, Reservas 8003)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  catalog_pgdata:
