[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "catalog-service"
version = "1.0.0"
description = "Microservicio de Catálogos para la Plataforma de Turismo de Santa Marta"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.8.0",
    "jsonschema>=4.21.1",
    "pika>=1.3",
    "aio-pika>=9.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "import-linter>=2.0",
    "mypy>=1.9.0",
    "ruff>=0.3.4",
]

[tool.hatch.build.targets.wheel]
packages = ["catalog_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_configs = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
ignore = [
    "B008",   # Do not perform function call in argument defaults (FastAPI Depends/Query pattern)
    "BLE001", # Do not catch blind exception
    "S110",   # try-except-pass
    "UP046",  # Generic class subclassing
    "SIM102", # Nested if statements
    "SIM211", # True/False ternary
]

[tool.importlinter]
root_package = "catalog_service"
