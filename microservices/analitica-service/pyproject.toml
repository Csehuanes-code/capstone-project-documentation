[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "servicio-analitica"
version = "0.1.0"
description = "Indicadores turísticos, capacidad de carga y alertas (CU-30, CU-31)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "pika>=1.3",
  "pyjwt[crypto]>=2.9",
  "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.3", "mypy>=1.9", "import-linter>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.importlinter]
root_package = "analitica"
name = "Clean Architecture - Analitica"

[[tool.importlinter.contracts]]
name = "Capas internas no dependen de adaptadores externos"
type = "layers"
layers = ["analitica.api", "analitica.aplicacion", "analitica.dominio"]

