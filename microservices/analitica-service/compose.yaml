services:
  postgres-analitica:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: analitica_db
      POSTGRES_USER: analitica
      POSTGRES_PASSWORD: analitica_local
    ports: ["127.0.0.1:55434:5432"]
    volumes: [analitica_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analitica -d analitica_db"]
      interval: 5s
      timeout: 3s
      retries: 10
  rabbitmq-analitica:
    image: rabbitmq:3-management
    ports: ["127.0.0.1:5673:5672", "127.0.0.1:15673:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  analitica:
    build: .
    env_file: .env
    ports: ["127.0.0.1:8004:8000"]
    depends_on:
      postgres-analitica: {condition: service_healthy}
      rabbitmq-analitica: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  analitica_pg:
