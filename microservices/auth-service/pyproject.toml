[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "santa-marta-auth-service"
version = "0.1.0"
description = "Borrador independiente del microservicio Auth"
requires-python = ">=3.12,<3.13"
dependencies = [
    "argon2-cffi>=23.1,<26.0",
    "fastapi>=0.115,<1.0",
    "PyJWT[crypto]>=2.9,<3.0",
    "SQLAlchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "alembic>=1.14,<2.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20,<1.0",
    "httpx>=0.27,<1.0",
    "import-linter>=2.5,<3.0",
    "mypy>=1.11,<2.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.7,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.importlinter]
root_package = "auth_service"

[[tool.importlinter.contracts]]
name = "Clean Architecture: las dependencias apuntan hacia el dominio"
type = "layers"
layers = [
    "auth_service.api",
    "auth_service.infrastructure",
    "auth_service.application",
    "auth_service.domain",
]
ignore_imports = [
    "auth_service.api.main -> auth_service.infrastructure.clock",
    "auth_service.api.main -> auth_service.infrastructure.database",
    "auth_service.api.main -> auth_service.infrastructure.security",
    "auth_service.api.main -> auth_service.infrastructure.sessions",
]

[[tool.importlinter.contracts]]
name = "Las rutas HTTP no importan adaptadores de infraestructura"
type = "forbidden"
source_modules = [
    "auth_service.api.routes",
    "auth_service.api.schemas",
]
forbidden_modules = ["auth_service.infrastructure"]
