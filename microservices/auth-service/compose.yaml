services:
  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auth_db}
      POSTGRES_USER: ${POSTGRES_USER:-auth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-api:
    build: .
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      AUTH_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-auth}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}@auth-db:5432/${POSTGRES_DB:-auth_db}
      AUTH_JWT_PRIVATE_KEY_FILE: /run/secrets/auth-es256.pem
      AUTH_JWT_KID: ${AUTH_JWT_KID:-auth-local-1}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-http://localhost:8001}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-santa-marta-platform}
      AUTH_LOGIN_LOCKOUT_SECONDS: ${AUTH_LOGIN_LOCKOUT_SECONDS:-300}
    ports:
      - "${AUTH_API_PORT:-8001}:8000"   # 8001 en el PC (puertos del grupo: IA 8000, Auth 8001, Catálogo 8002, Reservas 8003, Analítica 8004)
    volumes:
      - ./secrets/auth-es256.pem:/run/secrets/auth-es256.pem:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  auth_postgres_data:
