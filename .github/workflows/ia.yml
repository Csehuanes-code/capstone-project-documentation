# CI del servicio IA: cada push y pull request corre las pruebas (incluida la regla de capas,
# EC-MANT-01) contra PostgreSQL 16 real, y verifica que la imagen Docker arranca.
name: CI servicio IA

on:
  push:
    paths:
      - "microservices/ia-service/**"
      - ".github/workflows/ia.yml"
      - "contratos/**"
  pull_request:
    paths:
      - "microservices/ia-service/**"
      - ".github/workflows/ia.yml"
      - "contratos/**"

# Los comandos corren dentro de la carpeta del servicio (monorepo).
defaults:
  run:
    working-directory: microservices/ia-service

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ia_test
          POSTGRES_USER: ia
          POSTGRES_PASSWORD: ia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ia -d ia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      IA_TEST_DATABASE_URL: postgresql+psycopg://ia:ia@localhost:5432/ia_test
      IA_TEST_RABBITMQ_URL: amqp://guest:guest@localhost:5672/%2F
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: microservices/ia-service/requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Regla de dependencia entre capas (import-linter)
        run: lint-imports
        env:
          PYTHONPATH: src

      - name: Pruebas (memoria, SQLite, PostgreSQL y RabbitMQ)
        run: pytest -q -rs

  imagen:
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t servicio-ia:ci .

      - name: Arrancar y verificar que responde
        run: |
          docker run -d --name ia -p 8000:8000 servicio-ia:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/ready; then break; fi
            sleep 1
          done
          curl -fsS "http://localhost:8000/api/v1/ia/recomendaciones?intereses=naturaleza" | python3 -m json.tool | head -40
          test "$(docker inspect -f '{{.State.Health.Status}}' ia)" != "unhealthy"

      - name: Logs si algo falla
        if: failure()
        run: docker logs ia || true
