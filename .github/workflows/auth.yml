name: Auth service CI

on:
  push:
    paths:
      - "microservices/auth-service/**"
      - ".github/workflows/auth.yml"
  pull_request:
    paths:
      - "microservices/auth-service/**"
      - ".github/workflows/auth.yml"

# Los comandos corren dentro de la carpeta del servicio (monorepo).
defaults:
  run:
    working-directory: microservices/auth-service

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: auth_test
          POSTGRES_PASSWORD: auth_test_only_local
          POSTGRES_DB: auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth_test -d auth_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AUTH_TEST_DATABASE_URL: postgresql+asyncpg://auth_test:auth_test_only_local@localhost:5432/auth_test
      AUTH_INTEGRATION_DATABASE_URL: postgresql+asyncpg://auth_test:auth_test_only_local@localhost:5432/auth_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: microservices/auth-service/pyproject.toml
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Check formatting and lint
        run: ruff check src tests migrations
      - name: Check Clean Architecture boundaries
        run: lint-imports
      - name: Check types
        run: mypy --strict src
      - name: Apply database migrations
        env:
          AUTH_DATABASE_URL: postgresql+asyncpg://auth_test:auth_test_only_local@localhost:5432/auth_test
        run: alembic upgrade head
      - name: Run unit, database, and integration tests
        run: python -m pytest -p no:cacheprovider
      - name: Check migration metadata
        env:
          AUTH_DATABASE_URL: postgresql+asyncpg://auth_test:auth_test_only_local@localhost:5432/auth_test
        run: alembic check
      - name: Build service container
        run: docker build --tag santa-marta-auth-service:test .
