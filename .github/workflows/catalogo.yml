name: Catalog Service CI

on:
  push:
    paths:
      - "microservices/catalog-service/**"
      - ".github/workflows/catalogo.yml"
      - "contratos/**"
  pull_request:
    paths:
      - "microservices/catalog-service/**"
      - ".github/workflows/catalogo.yml"
      - "contratos/**"

# Los comandos corren dentro de la carpeta del servicio (monorepo).
defaults:
  run:
    working-directory: microservices/catalog-service

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: catalogo_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: microservices/catalog-service/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Lint with ruff
        run: |
          ruff check catalog_service tests

      - name: Type check with mypy
        run: |
          mypy catalog_service

      - name: Verify Clean Architecture boundaries with import-linter
        run: |
          lint-imports --config .importlinter

      - name: Run migrations with Alembic
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/catalogo_db
        run: |
          alembic upgrade head

      - name: Run unit, API, contract and integration tests with pytest
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/catalogo_db
          ENVIRONMENT: test
          # Relevo del outbox contra PostgreSQL y RabbitMQ reales (tests/integration)
          CATALOG_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/catalogo_db
          CATALOG_TEST_RABBITMQ_URL: amqp://guest:guest@localhost:5672/%2F
        run: |
          pytest --cov=catalog_service --cov-report=term-missing --cov-report=xml --cov-fail-under=70

      - name: Build Docker image
        run: docker build -t catalog-service:ci .
