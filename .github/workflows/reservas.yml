name: CI servicio Reservas

on:
  push:
    paths:
      - "microservices/reservas-service/**"
      - "comun/**"
      - "contratos/**"
      - ".github/workflows/reservas.yml"
  pull_request:
    paths:
      - "microservices/reservas-service/**"
      - "comun/**"
      - "contratos/**"
      - ".github/workflows/reservas.yml"

defaults:
  run:
    working-directory: microservices/reservas-service

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: reservas_test
          POSTGRES_USER: reservas
          POSTGRES_PASSWORD: reservas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reservas -d reservas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      RESERVAS_TEST_DATABASE_URL: postgresql+psycopg://reservas:reservas@localhost:5432/reservas_test
      RESERVAS_TEST_RABBITMQ_URL: amqp://guest:guest@localhost:5672/%2F
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: microservices/reservas-service/requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Verificar límites de Clean Architecture
        run: lint-imports
        env:
          PYTHONPATH: src

      - name: Ejecutar pruebas de Reservas y plantilla común
        run: |
          pytest -q -rs
          cd ../../comun
          pytest -q

  imagen:
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen desde la raíz del monorepo
        working-directory: .  # la imagen necesita comun/: el contexto es la raíz del repo
        run: docker build -f microservices/reservas-service/Dockerfile -t servicio-reservas:ci .
